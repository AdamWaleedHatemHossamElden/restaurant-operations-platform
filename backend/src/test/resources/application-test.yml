spring:
  datasource:
    url: jdbc:h2:mem:restaurant_operations_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  auth:
    jwt-secret: test-only-phase-2a-signing-key-at-least-32-bytes-long
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    cookie-secure: false
    cookie-same-site: Lax
